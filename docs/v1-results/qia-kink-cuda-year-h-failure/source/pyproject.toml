[project]
name = "noahmp-clm"
version = "0.2.0"
description = "Noah-MP / CLM 单柱物理的纯 Python 基线实现：格点完全独立的 1D 陆面柱"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GISWLH" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]
gpu = ["jax[cpu]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"noahmp_clm.gpu.cuda" = ["*.cu"]
"noahmp_clm" = ["data/*.npz", "data/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
